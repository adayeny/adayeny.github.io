<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="dpHeroTitle dpHeroDesc">
  <title id="dpHeroTitle">D270 offers about twice the memory capacity of H100 but roughly 0.45 times its memory bandwidth</title>
  <desc id="dpHeroDesc">Two paired bar charts drawn to scale. Capacity: the D270 reference card has 160 GB of LPDDR5X, bar twice as long as the H100's 80 GB of HBM3. Bandwidth: the D270 has 1.5 TB/s, bar about 0.45 times the length of the H100's 3.3 TB/s.</desc>
  <defs>
    <pattern id="dpGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c7cde8"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#eef0f7"/>
  <rect width="1200" height="400" fill="url(#dpGrid)"/>

  <!-- divider -->
  <line x1="640" y1="90" x2="640" y2="310" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- panel headers -->
  <text x="160" y="128" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="1" fill="#3a3f52">CAPACITY</text>
  <text x="790" y="128" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="1" fill="#3a3f52">BANDWIDTH</text>

  <!-- row labels -->
  <text x="140" y="181" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="14" fill="#3a3f52">D270</text>
  <text x="140" y="271" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="14" fill="#3a3f52">H100</text>

  <!-- capacity bars: 1.875 px per GB; D270 160 GB = 300 px, H100 80 GB = 150 px -->
  <rect x="160" y="150" width="300" height="50" rx="4" fill="#425BB5"/>
  <rect x="160" y="240" width="150" height="50" rx="4" fill="#3a3f52"/>

  <!-- bandwidth bars: 100 px per TB/s; D270 1.5 TB/s = 150 px, H100 3.3 TB/s = 330 px -->
  <rect x="790" y="150" width="150" height="50" rx="4" fill="#425BB5"/>
  <rect x="790" y="240" width="330" height="50" rx="4" fill="#3a3f52"/>
</svg>
