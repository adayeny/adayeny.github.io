<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="hHeroTitle hHeroDesc">
  <title id="hHeroTitle">The Hadamard gate moving a qubit from the pole to the equator</title>
  <desc id="hHeroDesc">A small Bloch sphere with a vector pointing to the north pole, labeled ket-0, an arrow labeled H, and a second Bloch sphere with the vector now pointing to the equator, labeled the plus state, an equal superposition of ket-0 and ket-1.</desc>
  <defs>
    <pattern id="hGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c7cde8"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#eef0f7"/>
  <rect width="1200" height="400" fill="url(#hGrid)"/>

  <!-- Before: |0> at pole -->
  <g transform="translate(230,205)">
    <ellipse cx="0" cy="0" rx="130" ry="130" fill="none" stroke="#425BB5" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="130" ry="36" fill="none" stroke="#9fb0e0" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#425BB5" stroke-width="1.4"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#c7cde8" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#D33E43" stroke-width="3.2"/>
    <circle cx="0" cy="-130" r="6" fill="#D33E43"/>
    <text x="16" y="-136" font-family="sans-serif" font-size="20" fill="#3a55a1">|0&#10217;</text>
  </g>
  <text x="230" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5a6789">DEFINITE STATE</text>

  <!-- H box + arrow -->
  <g transform="translate(500,205)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#425BB5" stroke-width="2.5"/>
    <path d="M 80 -8 L 94 0 L 80 8 Z" fill="#425BB5"/>
    <rect x="-30" y="-28" width="60" height="56" rx="6" fill="#3a55a1"/>
    <text x="0" y="10" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="30" fill="#fff">H</text>
  </g>

  <!-- After: |+> on equator -->
  <g transform="translate(800,205)">
    <ellipse cx="0" cy="0" rx="130" ry="130" fill="none" stroke="#425BB5" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="130" ry="36" fill="none" stroke="#9fb0e0" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#425BB5" stroke-width="1.4"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#c7cde8" stroke-width="1"/>
    <path d="M 0 -130 A 130 130 0 0 1 130 0" fill="none" stroke="#e8a33d" stroke-width="1.6" stroke-dasharray="4 4"/>
    <line x1="0" y1="0" x2="130" y2="0" stroke="#D33E43" stroke-width="3.2"/>
    <circle cx="130" cy="0" r="6" fill="#D33E43"/>
    <text x="16" y="-136" font-family="sans-serif" font-size="18" fill="#9aa4c4">|0&#10217;</text>
    <text x="140" y="-14" font-family="sans-serif" font-weight="700" font-size="20" fill="#3a55a1">|+&#10217;</text>
  </g>
  <text x="800" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5a6789">EQUAL SUPERPOSITION</text>

  <text x="800" y="60" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#222">H|0&#10217; = (|0&#10217; + |1&#10217;) / &#8730;2</text>
</svg>
