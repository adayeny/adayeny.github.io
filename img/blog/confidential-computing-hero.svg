<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="ccHeroTitle ccHeroDesc">
  <title id="ccHeroTitle">A trusted execution environment isolated inside untrusted infrastructure</title>
  <desc id="ccHeroDesc">Encrypted data flows in and out of a locked, encrypted enclave sitting inside a larger zone labeled untrusted infrastructure: OS, hypervisor, and cloud provider, none of which can see inside the enclave.</desc>
  <defs>
    <pattern id="ccGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c7cde8"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#eef0f7"/>
  <rect width="1200" height="400" fill="url(#ccGrid)"/>

  <!-- outer untrusted zone -->
  <rect x="50" y="40" width="1100" height="320" rx="10" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="68" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" letter-spacing="1.5" fill="#666">UNTRUSTED INFRASTRUCTURE &#8212; OS &#183; HYPERVISOR &#183; CLOUD PROVIDER</text>

  <!-- eye-slash "cannot see" glyphs scattered in the untrusted zone -->
  <g stroke="#999" stroke-width="2" fill="none" stroke-linecap="round">
    <g transform="translate(140,300)">
      <path d="M -14 0 C -14 -10, 14 -10, 14 0 C 14 10, -14 10, -14 0 Z"/>
      <circle cx="0" cy="0" r="4" fill="#999" stroke="none"/>
      <line x1="-18" y1="-14" x2="18" y2="14"/>
    </g>
    <g transform="translate(1060,300)">
      <path d="M -14 0 C -14 -10, 14 -10, 14 0 C 14 10, -14 10, -14 0 Z"/>
      <circle cx="0" cy="0" r="4" fill="#999" stroke="none"/>
      <line x1="-18" y1="-14" x2="18" y2="14"/>
    </g>
    <g transform="translate(600,320)">
      <path d="M -14 0 C -14 -10, 14 -10, 14 0 C 14 10, -14 10, -14 0 Z"/>
      <circle cx="0" cy="0" r="4" fill="#999" stroke="none"/>
      <line x1="-18" y1="-14" x2="18" y2="14"/>
    </g>
  </g>

  <!-- data flow in -->
  <line x1="70" y1="200" x2="378" y2="200" stroke="#425BB5" stroke-width="2.5"/>
  <path d="M 366 192 L 380 200 L 366 208 Z" fill="#425BB5"/>
  <text x="220" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="0.5" fill="#3a55a1">ENCRYPTED PROMPT / WEIGHTS IN</text>

  <!-- data flow out -->
  <line x1="822" y1="200" x2="1130" y2="200" stroke="#425BB5" stroke-width="2.5"/>
  <path d="M 1118 192 L 1132 200 L 1118 208 Z" fill="#425BB5"/>
  <text x="975" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="0.5" fill="#3a55a1">ENCRYPTED RESPONSE OUT</text>

  <!-- TEE box -->
  <rect x="380" y="105" width="440" height="190" rx="10" fill="#3a55a1" stroke="#28356b" stroke-width="2"/>
  <text x="600" y="136" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#fff">TRUSTED EXECUTION ENVIRONMENT</text>

  <!-- lock icon -->
  <g transform="translate(510,185)">
    <path d="M -11 -9 a 11 11 0 0 1 22 0 v 9 h -22 z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-17" y="0" width="34" height="27" rx="4" fill="#fff"/>
    <circle cx="0" cy="11" r="3" fill="#3a55a1"/>
  </g>
  <text x="510" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" letter-spacing="0.3" fill="#dbe3fb">ENCRYPTED RAM</text>

  <!-- key icon (hardware root of trust) -->
  <g transform="translate(680,185)" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-8" cy="0" r="9"/>
    <line x1="1" y1="0" x2="20" y2="0"/>
    <line x1="13" y1="0" x2="13" y2="9"/>
    <line x1="20" y1="0" x2="20" y2="7"/>
  </g>
  <text x="680" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" letter-spacing="0.3" fill="#dbe3fb">ROOT OF TRUST</text>

  <text x="600" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="0.5" fill="#aebbe8">INVISIBLE TO THE OS, HYPERVISOR &amp; CLOUD PROVIDER</text>
</svg>
