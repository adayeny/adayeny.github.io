<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="pHeroTitle pHeroDesc">
  <title id="pHeroTitle">PAIR router hub connected to four machines</title>
  <desc id="pHeroDesc">A central PAIR hub with lines radiating to four nodes: an RTX desktop and a Linux server shown active and pulsing, a laptop and an Apple Silicon machine shown idle.</desc>
  <defs>
    <pattern id="pGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c7cde8"/>
    </pattern>
    <style>
      .pulse { animation: pairPulse 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
      .packet { animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes pairPulse {
        0%   { r: 34px; opacity: 0.55; }
        100% { r: 56px; opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; opacity: 0; }
        .packet { animation: none; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#eef0f7"/>
  <rect width="1200" height="400" fill="url(#pGrid)"/>

  <!-- spokes -->
  <line x1="600" y1="200" x2="220" y2="110" stroke="#425BB5" stroke-width="2.5"/>
  <line x1="600" y1="200" x2="220" y2="290" stroke="#c3c3c3" stroke-width="2"/>
  <line x1="600" y1="200" x2="980" y2="110" stroke="#425BB5" stroke-width="2.5"/>
  <line x1="600" y1="200" x2="980" y2="290" stroke="#c3c3c3" stroke-width="2"/>

  <!-- traveling request packets on the two active spokes -->
  <circle r="5" fill="#5b8dff" class="packet">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M600,200 L220,110"/>
  </circle>
  <circle r="5" fill="#5b8dff" class="packet">
    <animateMotion dur="3.1s" repeatCount="indefinite" path="M600,200 L980,110"/>
  </circle>

  <!-- hub -->
  <circle cx="600" cy="200" r="44" fill="#3a55a1"/>
  <text x="600" y="207" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" letter-spacing="1" fill="#fff">PAIR</text>

  <!-- Node: RTX desktop (active) -->
  <circle class="pulse" cx="220" cy="110" r="34" fill="#5b8dff" opacity="0.55" style="animation-delay:0s"/>
  <circle cx="220" cy="110" r="30" fill="#fff" stroke="#425BB5" stroke-width="3"/>
  <rect x="207" y="98" width="26" height="18" rx="2" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="215" y="118" width="10" height="4" fill="#333"/>
  <text x="220" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="1" fill="#333">RTX DESKTOP</text>
  <text x="220" y="173" text-anchor="middle" font-family="sans-serif" font-size="10" letter-spacing="1" fill="#5b8dff">● ACTIVE</text>

  <!-- Node: laptop (idle) -->
  <circle cx="220" cy="290" r="30" fill="#fff" stroke="#bbb" stroke-width="3"/>
  <path d="M 204 296 h 32 l -4 10 h -24 z" fill="none" stroke="#999" stroke-width="2"/>
  <rect x="206" y="282" width="28" height="14" rx="1.5" fill="none" stroke="#999" stroke-width="2"/>
  <text x="220" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="1" fill="#666">LAPTOP</text>
  <text x="220" y="345" text-anchor="middle" font-family="sans-serif" font-size="10" letter-spacing="1" fill="#999">● IDLE</text>

  <!-- Node: Linux server (active) -->
  <circle class="pulse" cx="980" cy="110" r="34" fill="#5b8dff" opacity="0.55" style="animation-delay:1.1s"/>
  <circle cx="980" cy="110" r="30" fill="#fff" stroke="#425BB5" stroke-width="3"/>
  <rect x="967" y="97" width="26" height="7" rx="1" fill="none" stroke="#333" stroke-width="1.6"/>
  <rect x="967" y="106" width="26" height="7" rx="1" fill="none" stroke="#333" stroke-width="1.6"/>
  <rect x="967" y="115" width="26" height="7" rx="1" fill="none" stroke="#333" stroke-width="1.6"/>
  <text x="980" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="1" fill="#333">LINUX SERVER</text>
  <text x="980" y="173" text-anchor="middle" font-family="sans-serif" font-size="10" letter-spacing="1" fill="#5b8dff">● ACTIVE</text>

  <!-- Node: Apple Silicon (idle) -->
  <circle cx="980" cy="290" r="30" fill="#fff" stroke="#bbb" stroke-width="3"/>
  <rect x="966" y="280" width="28" height="18" rx="2" fill="none" stroke="#999" stroke-width="2"/>
  <rect x="974" y="298" width="12" height="3" fill="#999"/>
  <text x="980" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="1" fill="#666">APPLE SILICON</text>
  <text x="980" y="345" text-anchor="middle" font-family="sans-serif" font-size="10" letter-spacing="1" fill="#999">● IDLE</text>
</svg>
