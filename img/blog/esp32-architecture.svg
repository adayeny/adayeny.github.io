<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="archTitle archDesc" font-family="sans-serif">
  <title id="archTitle">Agent stack architecture on the ESP32-S3</title>
  <desc id="archDesc">An upstream LLM provider connects over HTTP, SSE, or JSON-RPC to the ESP32-S3, which runs ESP-IDF on Core 0 for Wi-Fi and BLE, and Linux 6.11 on Core 1 running WAMR, which runs the fx agent, which reaches the local filesystem, shell, and GPIO.</desc>
  <rect width="900" height="620" fill="#fff"/>

  <!-- Upstream provider -->
  <rect x="220" y="16" width="460" height="66" rx="6" fill="#eef0f7" stroke="#425BB5" stroke-width="2"/>
  <text x="450" y="42" text-anchor="middle" font-weight="700" font-size="16" fill="#3a55a1">Upstream LLM Provider</text>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#5a6789">Vercel AI Gateway · Ollama · Local Server</text>

  <!-- bidirectional arrow -->
  <line x1="450" y1="82" x2="450" y2="126" stroke="#425BB5" stroke-width="2.5"/>
  <path d="M 444 90 L 450 80 L 456 90 Z" fill="#425BB5"/>
  <path d="M 444 118 L 450 128 L 456 118 Z" fill="#425BB5"/>
  <text x="466" y="107" font-size="12" fill="#5a6789">HTTP / SSE / JSON-RPC</text>

  <!-- Outer ESP32 box -->
  <rect x="60" y="132" width="780" height="470" rx="10" fill="#fafafa" stroke="#333" stroke-width="2.5"/>
  <text x="450" y="160" text-anchor="middle" font-weight="700" font-size="16" fill="#222">ESP32-S3 (reTerminal E1001)</text>

  <!-- Core 0 -->
  <rect x="90" y="182" width="270" height="390" rx="8" fill="#f1f1f1" stroke="#888" stroke-width="1.5"/>
  <text x="225" y="210" text-anchor="middle" font-weight="700" font-size="14" fill="#444">Core 0</text>
  <text x="225" y="230" text-anchor="middle" font-size="12" fill="#666">ESP-IDF RTOS</text>
  <text x="225" y="248" text-anchor="middle" font-size="11" fill="#888">Wi-Fi / BLE baseband</text>

  <!-- shared memory link -->
  <line x1="360" y1="330" x2="410" y2="330" stroke="#425BB5" stroke-width="2.5"/>
  <path d="M 400 322 L 412 330 L 400 338 Z" fill="#425BB5"/>
  <path d="M 372 322 L 360 330 L 372 338 Z" fill="#425BB5"/>
  <text x="385" y="312" text-anchor="middle" font-size="10.5" fill="#5a6789">shared</text>
  <text x="385" y="352" text-anchor="middle" font-size="10.5" fill="#5a6789">espsta0</text>

  <!-- Core 1 -->
  <rect x="410" y="182" width="400" height="390" rx="8" fill="#eef0f7" stroke="#425BB5" stroke-width="1.5"/>
  <text x="610" y="210" text-anchor="middle" font-weight="700" font-size="14" fill="#3a55a1">Core 1 — Linux 6.11 (NOMMU Xtensa)</text>

  <!-- WAMR -->
  <rect x="430" y="228" width="360" height="320" rx="8" fill="#e2e8fb" stroke="#5b8dff" stroke-width="1.5"/>
  <text x="610" y="252" text-anchor="middle" font-weight="700" font-size="13" fill="#2f4485">WAMR — WebAssembly Micro Runtime</text>

  <!-- fx agent -->
  <rect x="450" y="270" width="320" height="240" rx="8" fill="#d3ddf7" stroke="#3a55a1" stroke-width="1.5"/>
  <text x="610" y="294" text-anchor="middle" font-weight="700" font-size="13" fill="#28356b">fx Agent</text>
  <text x="610" y="312" text-anchor="middle" font-size="11" fill="#3a4a7a">fx.wasm — compiled with Zig</text>

  <!-- local resources -->
  <rect x="470" y="330" width="280" height="150" rx="8" fill="#3a55a1"/>
  <text x="610" y="360" text-anchor="middle" font-weight="700" font-size="13" fill="#fff">Local Resources</text>
  <text x="610" y="384" text-anchor="middle" font-size="12" fill="#dbe3fb">Filesystem</text>
  <text x="610" y="406" text-anchor="middle" font-size="12" fill="#dbe3fb">Shell</text>
  <text x="610" y="428" text-anchor="middle" font-size="12" fill="#dbe3fb">GPIO</text>
</svg>
