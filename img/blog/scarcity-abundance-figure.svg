<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="saTitle saDesc">
  <title id="saTitle">Scarcity economics versus abundance economics</title>
  <desc id="saDesc">A capped, divided circle labeled finite resources leading to competition, beside an open, radiating circle labeled off-world abundance leading to cooperation.</desc>
  <defs>
    <pattern id="saGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c7cde8"/>
    </pattern>
  </defs>
  <rect width="900" height="340" fill="#eef0f7"/>
  <rect width="900" height="340" fill="url(#saGrid)"/>
  <line x1="450" y1="30" x2="450" y2="270" stroke="#b9c2e6" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Left: finite resources -->
  <g transform="translate(230,140)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#444" stroke-width="3"/>
    <path d="M -75 0 A 75 75 0 0 1 75 0" fill="none" stroke="#444" stroke-width="3"/>
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#444" stroke-width="3"/>
    <line x1="0" y1="-75" x2="0" y2="0" stroke="#444" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="-53" y1="-53" x2="0" y2="0" stroke="#444" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="53" y1="-53" x2="0" y2="0" stroke="#444" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M -14 -10 L 14 10 M 14 -10 L -14 10" stroke="#D33E43" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="230" y="240" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" letter-spacing="0.5" fill="#333">FINITE RESOURCES</text>
  <text x="230" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" letter-spacing="1" fill="#8a3a3a">SCARCITY &#8594; COMPETITION</text>

  <!-- Right: off-world abundance -->
  <g transform="translate(670,140)">
    <circle cx="0" cy="0" r="42" fill="#3a55a1"/>
    <g stroke="#3a55a1" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-58" x2="0" y2="-78"/>
      <line x1="41" y1="-41" x2="55" y2="-55"/>
      <line x1="58" y1="0" x2="78" y2="0"/>
      <line x1="41" y1="41" x2="55" y2="55"/>
      <line x1="0" y1="58" x2="0" y2="78"/>
      <line x1="-41" y1="41" x2="-55" y2="55"/>
      <line x1="-58" y1="0" x2="-78" y2="0"/>
      <line x1="-41" y1="-41" x2="-55" y2="-55"/>
    </g>
    <path d="M -13 2 L -4 11 L 15 -9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="670" y="240" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" letter-spacing="0.5" fill="#3a55a1">OFF-WORLD ABUNDANCE</text>
  <text x="670" y="266" text-anchor="middle" font-family="sans-serif" font-size="13" letter-spacing="1" fill="#425BB5">ABUNDANCE &#8594; COOPERATION</text>
</svg>
