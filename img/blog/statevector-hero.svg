<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="svHeroTitle svHeroDesc">
  <title id="svHeroTitle">A qubit state vector on the Bloch sphere</title>
  <desc id="svHeroDesc">A sphere with poles labeled ket-0 and ket-1, and an arrow from the center to a point on the surface at angle theta from the z-axis and phi around the equator, labeled psi.</desc>
  <defs>
    <pattern id="svGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#c7cde8"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#eef0f7"/>
  <rect width="1200" height="400" fill="url(#svGrid)"/>

  <g transform="translate(330,205)">
    <ellipse cx="0" cy="0" rx="150" ry="150" fill="none" stroke="#425BB5" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="150" ry="42" fill="none" stroke="#9fb0e0" stroke-width="1.6" stroke-dasharray="5 5"/>
    <ellipse cx="0" cy="0" rx="46" ry="150" fill="none" stroke="#c7cde8" stroke-width="1.2"/>
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#425BB5" stroke-width="1.6"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#c7cde8" stroke-width="1.2"/>

    <circle cx="0" cy="-150" r="5" fill="#3a55a1"/>
    <text x="14" y="-146" font-family="sans-serif" font-size="20" fill="#3a55a1">|0&#10217;</text>
    <circle cx="0" cy="150" r="5" fill="#3a55a1"/>
    <text x="14" y="166" font-family="sans-serif" font-size="20" fill="#3a55a1">|1&#10217;</text>

    <!-- state vector to a point on the surface -->
    <line x1="0" y1="0" x2="96" y2="-88" stroke="#D33E43" stroke-width="3"/>
    <circle cx="96" cy="-88" r="5.5" fill="#D33E43"/>
    <text x="108" y="-92" font-family="sans-serif" font-weight="700" font-size="22" fill="#D33E43">|&#968;&#10217;</text>

    <!-- theta arc from z-axis -->
    <path d="M 0 -60 A 60 60 0 0 1 44 -40" fill="none" stroke="#5a6789" stroke-width="1.6"/>
    <text x="18" y="-64" font-family="sans-serif" font-style="italic" font-size="15" fill="#5a6789">&#952;</text>

    <!-- phi arc on equator -->
    <path d="M 40 6 A 40 12 0 0 1 30 -8" fill="none" stroke="#5a6789" stroke-width="1.4"/>
    <text x="44" y="22" font-family="sans-serif" font-style="italic" font-size="14" fill="#5a6789">&#966;</text>

    <!-- projection guide -->
    <line x1="96" y1="-88" x2="96" y2="0" stroke="#9fb0e0" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="0" y1="0" x2="96" y2="0" stroke="#9fb0e0" stroke-width="1.2" stroke-dasharray="3 3"/>
  </g>

  <text x="330" y="378" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" letter-spacing="1" fill="#3a55a1">|&#968;&#10217; = cos(&#952;/2)|0&#10217; + e^(i&#966;)sin(&#952;/2)|1&#10217;</text>

  <line x1="660" y1="60" x2="660" y2="340" stroke="#b9c2e6" stroke-width="2" stroke-dasharray="8 8"/>

  <g font-family="sans-serif">
    <text x="700" y="120" font-size="22" font-weight="700" fill="#222">Amplitudes &#8800; Probabilities</text>
    <text x="700" y="156" font-size="15" fill="#444">&#945; and &#946; are complex numbers.</text>
    <text x="700" y="180" font-size="15" fill="#444">Probability only appears when you</text>
    <text x="700" y="204" font-size="15" fill="#444">square their magnitude:</text>

    <text x="700" y="252" font-size="19" font-weight="700" fill="#3a55a1">P(0) = |&#945;|&#178;</text>
    <text x="700" y="284" font-size="19" font-weight="700" fill="#3a55a1">P(1) = |&#946;|&#178;</text>
    <text x="700" y="316" font-size="15" fill="#444">|&#945;|&#178; + |&#946;|&#178; = 1</text>
  </g>
</svg>
